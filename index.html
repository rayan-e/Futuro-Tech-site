<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futuro Tech — 3 expertises, une même vision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
/* ============ IMAGES À AJOUTER MANUELLEMENT ============
   Place tes fichiers dans le dossier "images/" à côté de ce fichier
   et ajuste simplement les noms ci-dessous. */
:root {
  --i1: url("images/solutions.webp");   /* Futuro Tech Solutions */
  --i2: url("images/design.webp");      /* Futuro Tech Design    */
  --i3: url("images/smile.webp");       /* Futuro Tech Smile     */
}
/* Logo : images/logo.png (voir balises <img class="lg"> dans le HTML) */

/* ============ THÈME ============ */
:root {
  --bg: #fbfdfd; --card: #fff; --ink: #0c1a1e; --mute: #53656b; --line: #e1ebec;
  --accent: #0fb5aa; --btn: #0a857c; --btnt: #fff; --lgf: none;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071014; --card: #0d181d; --ink: #eef6f6; --mute: #8fa5ab; --line: #1b2a30;
    --accent: #2fd0c3; --btn: #2fd0c3; --btnt: #04201d; --lgf: invert(1) hue-rotate(180deg);
  }
}
:root[data-theme="dark"] {
  --bg: #071014; --card: #0d181d; --ink: #eef6f6; --mute: #8fa5ab; --line: #1b2a30;
  --accent: #2fd0c3; --btn: #2fd0c3; --btnt: #04201d; --lgf: invert(1) hue-rotate(180deg);
}

/* ============ BASE ============ */
html { scroll-padding-top: 76px; scroll-behavior: smooth; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.lg { height: 46px; width: auto; display: block; filter: var(--lgf); }

.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--btn); color: var(--btnt); padding: 12px 22px; border-radius: 99px; font: 600 .95rem Inter, sans-serif; text-decoration: none; border: 0; cursor: pointer; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ HEADER ============ */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 10px 24px; }
.links a { color: var(--ink); text-decoration: none; font-size: .93rem; font-weight: 500; margin: 0 14px; padding: 6px 0; border-bottom: 2px solid transparent; }
.links a:hover, .links a.cur { border-color: var(--accent); color: var(--accent); }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--mute); padding: 6px 11px; font: 600 .8rem Inter, sans-serif; cursor: pointer; }
.seg button.on { background: var(--btn); color: var(--btnt); }

/* ============ HERO ============ */
.hero { background: radial-gradient(900px 420px at 85% 25%, color-mix(in srgb, var(--accent) 16%, transparent), transparent); }
.hg { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; padding: 70px 24px 60px; }
.bar-l { width: 44px; height: 3px; background: var(--accent); margin-bottom: 26px; }
h1 { font-size: clamp(2.2rem, 5.4vw, 3.9rem); line-height: 1.08; margin: 0 0 20px; font-weight: 800; letter-spacing: -.02em; }
h1 span { color: var(--accent); display: block; }
.lead { color: var(--mute); font-size: 1.12rem; max-width: 44ch; margin: 0 0 26px; }
.scroll { display: inline-flex; gap: 10px; align-items: center; color: var(--mute); font-size: .85rem; margin-top: 26px; text-decoration: none; }

.collage { position: relative; aspect-ratio: 1 / .95; width: 100%; max-width: 500px; justify-self: center; }
.tile { position: absolute; width: 56%; aspect-ratio: 1; border-radius: 18px; background-size: cover; border: 1px solid var(--line); box-shadow: 0 24px 50px rgba(0,0,0,.22); animation: float 7s ease-in-out infinite; }
.t1 { top: 0; left: 0; rotate: -4deg; background-image: var(--i1); background-position: 50% 40%; }
.t2 { top: 14%; right: 0; rotate: 5deg; animation-delay: -2.3s; background-image: var(--i2); background-position: 75% 30%; }
.t3 { bottom: 0; left: 22%; rotate: -1deg; animation-delay: -4.6s; background-image: var(--i3); background-position: 50% 60%; }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; } }

/* ============ SECTIONS ============ */
section { padding: 72px 0; }
h2 { font: 400 clamp(1.9rem, 4.2vw, 2.9rem)/1.1 Newsreader, Georgia, serif; letter-spacing: -.02em; margin: 0 0 34px; max-width: 20ch; }

/* Cartes activités */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(10,40,45,.06); transition: transform .35s, border-color .35s; }
.card:hover { transform: translateY(-5px); border-color: var(--accent); }
.phw { height: 210px; overflow: hidden; }
.ph { height: 100%; background-size: cover; background-position: center; transition: transform .9s; }
.card:hover .ph { transform: scale(1.07); }
.ph.p1 { background-image: var(--i1); background-position: 50% 40%; }
.ph.p2 { background-image: var(--i2); background-position: 78% 30%; }
.ph.p3 { background-image: var(--i3); }
.body { padding: 20px 24px 26px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.n { color: var(--accent); font-size: .82rem; font-weight: 700; }
.card h3 { margin: 0; font: 400 1.5rem Newsreader, Georgia, serif; }
.card p { margin: 0; color: var(--mute); flex: 1; }
.l { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--accent); align-self: flex-start; }
.soon { align-self: flex-start; font-size: .8rem; padding: 5px 12px; border: 1px dashed var(--accent); color: var(--accent); border-radius: 99px; }

/* Vision */
.vis { background: radial-gradient(700px 300px at 100% 0, rgba(47,208,195,.28), transparent), #06141a; color: #eef6f6; padding: 64px 0; }
.vg { display: grid; grid-template-columns: 1.1fr 2fr; gap: 40px; align-items: center; }
.vis h2 { font: 700 clamp(1.8rem, 3.8vw, 2.6rem) Inter, sans-serif; max-width: none; margin: 0 0 14px; }
.vis h2 span { color: #2fd0c3; }
.vis p { color: #b9cdd1; margin: 0; }
.vals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 20px; text-align: center; }
.vals svg { width: 34px; height: 34px; stroke: #2fd0c3; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.vals h4 { margin: 8px 0 2px; font-size: .98rem; }
.vals p { font-size: .82rem; }

/* Rendez-vous (fond animé) */
.stage { position: relative; isolation: isolate; border-radius: 24px; overflow: hidden; padding: 60px 20px; display: flex; justify-content: center; background: #06141a; }
.bg { position: absolute; inset: 0; z-index: -2; }
.bg i { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; animation: ken 21s infinite; }
.bg i:nth-child(1) { background-image: var(--i1); }
.bg i:nth-child(2) { background-image: var(--i2); animation-delay: 7s; }
.bg i:nth-child(3) { background-image: var(--i3); animation-delay: 14s; }
@keyframes ken {
  0% { opacity: 0; transform: scale(1.02); }
  5%, 33% { opacity: 1; }
  40%, 100% { opacity: 0; transform: scale(1.13); }
}
.shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(4,14,18,.72), rgba(4,14,18,.9)); }
.glass { width: 100%; max-width: 580px; background: rgba(6,20,26,.68); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 30px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #eef6f6; text-align: center; }
.glass h2 { font: 400 clamp(1.6rem, 3.6vw, 2.2rem)/1.15 Newsreader, Georgia, serif; color: #fff; margin: 6px auto 10px; }
.glass p { color: #c3d3d6; margin: 0 0 18px; }
.glass .btn { background: #2fd0c3; color: #04201d; width: 100%; justify-content: center; }
.glass input { border-color: rgba(255,255,255,.25); color: #fff; }

/* Formulaires */
form { display: flex; flex-direction: column; gap: 11px; text-align: left; }
label { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 600; }
input, textarea { width: 100%; background: rgba(127,150,150,.12); color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; }
textarea { min-height: 90px; resize: vertical; }

/* Contact + carte */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
.box .mail-line { font-size: .9rem; margin: 16px 0 0; }
.box .mail-line a { color: var(--ink); }
.map { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.map svg { width: 100%; display: block; }
.map div { padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.map a { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); text-decoration: none; }

/* Footer */
footer { border-top: 1px solid var(--line); padding: 36px 0 28px; color: var(--mute); font-size: .9rem; }
.fg { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 28px; }
.fg a { color: var(--mute); display: block; text-decoration: none; margin-bottom: 6px; }
.fg a:hover { color: var(--accent); }
.cp { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 16px; font-size: .82rem; }

/* Animation d'apparition */
.js .rv { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s; }
.js .rv.in { opacity: 1; transform: none; }

/* Responsive */
@media (max-width: 820px) {
  .hg, .vg { grid-template-columns: 1fr; }
  .hg { padding-top: 36px; }
  .links { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bg i, .tile { animation: none; }
  .bg i:first-child { opacity: 1; }
  .js .rv { opacity: 1; transform: none; transition: none; }
  .ph, .card { transition: none; }
}
</style>
</head>

    mb: "Request a meeting", lbn: "Name", lbe: "Email", lbd: "Preferred times",
    pm: "Your message", ch: "Let's talk about your project.", cb: "Send by email",
    mapl: "Open in Google Maps", imp: "Human impact",
    cp: "© 2026 Futuro Tech. All rights reserved.",
    ms: "1-on-1 meeting request with the founder",
    cs2: "Contact from the Futuro Tech website"
  }
};

var lang = "fr";
function Q(sel) { return document.querySelectorAll(sel); }
function V(id) { return document.getElementById(id).value; }

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  Q("[data-i]").forEach(function (e) { e.textContent = T[l][e.dataset.i]; });
  Q("#lang button").forEach(function (b) { b.classList.toggle("on", b.dataset.l === l); });
  try { localStorage.setItem("ft-lang", l); } catch (e) {}
}

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  Q("#theme button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === t); });
  try { localStorage.setItem("ft-theme", t); } catch (e) {}
}

function mailto(subject, body) {
  location.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

Q("#lang button").forEach(function (b) { b.onclick = function () { setLang(b.dataset.l); }; });
Q("#theme button").forEach(function (b) { b.onclick = function () { setTheme(b.dataset.t); }; });

document.getElementById("mf").onsubmit = function (e) {
  e.preventDefault();
  mailto(T[lang].ms, V("mn") + " <" + V("me") + ">\n" + V("md"));
};
document.getElementById("cf").onsubmit = function (e) {
  e.preventDefault();
  mailto(T[lang].cs2, V("cn") + " <" + V("ce") + ">\n\n" + V("cm"));
};

["mail", "mail2"].forEach(function (id) {
  var a = document.getElementById(id);
  a.textContent = EMAIL;
  a.href = "mailto:" + EMAIL;
});

/* Langue + thème initiaux */
var startLang = "fr", startTheme = "light";
try {
  startLang = localStorage.getItem("ft-lang") || ((navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr");
  startTheme = localStorage.getItem("ft-theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
} catch (e) {}
setLang(startLang);
setTheme(startTheme);
document.documentElement.classList.add("js");

/* Apparition au scroll */
var reveal = Q(".rv");
if (!("IntersectionObserver" in window)) {
  reveal.forEach(function (e) { e.classList.add("in"); });
} else {
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (x) {
      if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); }
    });
  }, { threshold: .12 });
  reveal.forEach(function (e) { io.observe(e); });
}
</script>
</body>
</html>
