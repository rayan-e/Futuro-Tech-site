<style>
:root{
  --bg:#FBF3E4; --bg2:#F3E3C3; --surface:#FFFAF0; --ink:#2A1A12; --muted:#6B5346;
  --saffron:#E8A317; --terra:#C4532D; --terra-text:#A8401F; --harissa:#8F2A1C; --olive:#3E4A2A;
  --line:rgba(42,26,18,.14); --dot:rgba(42,26,18,.38); --shadow:0 18px 40px -18px rgba(90,45,15,.35);
  --btn-bg:#A8401F; --btn-ink:#FFF6E6; --header-bg:rgba(251,243,228,.86);
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hdr:72px; --nav:60px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1A110C; --bg2:#241811; --surface:#2B1D14; --ink:#F7EBD3; --muted:#CDB89E;
    --terra:#E0704A; --terra-text:#F09A72; --line:rgba(247,235,211,.16); --dot:rgba(247,235,211,.4); --shadow:0 18px 40px -18px rgba(0,0,0,.7);
    --btn-bg:#E8A317; --btn-ink:#2A1A12; --header-bg:rgba(26,17,12,.86);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A110C; --bg2:#241811; --surface:#2B1D14; --ink:#F7EBD3; --muted:#CDB89E;
  --terra:#E0704A; --terra-text:#F09A72; --line:rgba(247,235,211,.16); --dot:rgba(247,235,211,.4); --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --btn-bg:#E8A317; --btn-ink:#2A1A12; --header-bg:rgba(26,17,12,.86);
}
/* Polices selon la langue */
[lang="ar"]{--font-body:'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;--font-display:'Noto Naskh Arabic','Noto Sans Arabic',Georgia,serif}
[lang="zh"]{--font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;--font-display:'Noto Serif SC','Songti SC','SimSun',serif}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + var(--nav) + 16px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
svg{max-width:100%}
a{color:inherit}
h1,h2{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
p{margin:0;text-wrap:pretty}
.wrap{width:min(1120px,100% - clamp(40px,8vw,80px));margin-inline:auto}
.icon{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:8px}
.eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-text)}
[dir="rtl"] .eyebrow,[lang="ar"] .eyebrow,[lang="zh"] .eyebrow{letter-spacing:.04em}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor;border-radius:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.45rem;letter-spacing:-.02em}
.brand-mark{width:38px;height:38px;color:var(--terra)}
.actions{display:flex;align-items:center;gap:.5rem}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-width:46px;height:46px;padding:0 .8rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;transition:background .25s ease,transform .2s ease}
.icon-btn.round{padding:0;width:46px;border-radius:50%}
.icon-btn:hover{background:var(--bg2)}
.icon-btn:active{transform:scale(.95)}
.theme-sun{display:none}
:root[data-theme="dark"] .theme-sun{display:block}
:root[data-theme="dark"] .theme-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-sun{display:block}:root:not([data-theme="light"]) .theme-moon{display:none}}

/* Sélecteur de langue */
.lang{position:relative}
.lang-menu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:210px;padding:.4rem;margin:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:70}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:1rem;min-height:46px;padding:0 .9rem;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;text-align:start}
.lang-menu button:hover{background:var(--bg2)}
.lang-menu button[aria-checked="true"]{background:var(--bg2);font-weight:700}
.lang-menu button>span:first-child{flex:1}
.lang-menu .code{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--terra-text)}
.lang-menu svg{visibility:hidden;width:1.1em;height:1.1em}
.lang-menu button[aria-checked="true"] svg{visibility:visible}

/* Hero */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(36px,6vw,80px) 0 clamp(32px,5vw,56px);text-align:center}
.pattern-bg{position:absolute;inset:0;z-index:-1;opacity:.09;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 72%);mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 72%)}
.pattern-bg svg{width:100%;height:100%}
.hero h1{font-size:clamp(2.8rem,8vw,5.4rem);margin:1rem 0 1rem}
.hero .lead{max-width:44ch;margin-inline:auto;color:var(--muted);font-size:clamp(1.02rem,1.6vw,1.2rem)}
.pills{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.8rem}
.pill{min-height:46px;padding:0 1.15rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s ease}
.pill:hover{border-color:var(--terra-text)}
.pill:active{transform:scale(.96)}
.pill[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent}
.hero-cta{margin-top:1.4rem;display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:50px;padding:0 1.5rem;border-radius:999px;background:var(--btn-bg);color:var(--btn-ink);font-weight:700;font-size:1rem;text-decoration:none;border:2px solid transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(168,64,31,.6)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);box-shadow:none}
.price-note{margin-top:1rem;font-size:.9rem;color:var(--muted)}

/* Navigation des catégories */
.catnav{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:50;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.catnav ul{display:flex;gap:.5rem;list-style:none;margin:0;padding:.55rem 0;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.catnav ul::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 1.1rem;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.98rem;white-space:nowrap;transition:background .2s ease}
.chip:hover{background:var(--bg2)}
.chip.on{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent}

/* Carte */
.cat{padding:clamp(44px,7vw,80px) 0 0}
.cat-title{display:flex;align-items:center;gap:1.2rem;font-size:clamp(1.9rem,4.6vw,3rem);margin-bottom:1.6rem}
.cat-title::before,.cat-title::after{content:"";flex:1;height:2px;background:var(--saffron);opacity:.65;border-radius:2px}
.cat-title span{text-align:center}
.cat-note{margin:-.6rem auto 1.4rem;max-width:60ch;text-align:center;font-size:.9rem;font-weight:700;letter-spacing:.03em;color:var(--terra-text)}
.items{list-style:none;margin:0;padding:0}
@media (min-width:900px){.items{columns:2;column-gap:3.5rem}}
.item{break-inside:avoid;display:grid;grid-template-columns:minmax(0,auto) minmax(14px,1fr) auto;align-items:end;column-gap:.6rem;padding:.7rem .4rem;border-radius:12px;transition:background .2s ease}
.item:hover{background:var(--bg2)}
.nm{font-weight:700}
.ds{color:var(--muted);font-size:.94rem}
.ds::before{content:" – "}
.lead-dots{align-self:end;height:1px;border-bottom:2px dotted var(--dot);margin-bottom:.5em}
.price{font-weight:700;color:var(--terra-text);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.sauce{column-span:all;margin-top:.6rem;background:var(--bg2);padding:.9rem 1rem}
.item.sauce .nm{color:var(--terra-text)}

footer{margin-top:clamp(56px,8vw,96px);border-top:1px solid var(--line);padding:2rem 0 2.4rem;color:var(--muted);font-size:.95rem}
.foot{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between}
.foot a{text-decoration:none;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:.5rem;min-height:44px}
.foot a:hover{color:var(--terra-text)}

@media (max-width:520px){
  .brand{font-size:1.25rem}.brand-mark{width:32px;height:32px}
  .item{padding:.65rem .2rem;grid-template-columns:minmax(0,1fr) auto;align-items:start}
  .lead-dots{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

    en:{title:"The menu",lead:"Starters, couscous, tagines and grills: everything we love to share.",book:"Book a table",back:"Back to home",lang:"Language",prices:"Prices in euros.",note:"Ingredient availability may vary with the seasons.",theme:"Theme",cats:{cold:"Cold starters",hot:"Hot starters",couscous:"Couscous",tajines:"Tagines",grills:"Grills",extras:"Extra meat"}},

  };
  var SUP=["fr","en","ar","zh","de"], lang="fr", spy=null;
  var root=document.documentElement;
  function $(id){return document.getElementById(id);}

  /* ---------- Affichage ---------- */
  function render(){
    var u=UI[lang], chips="", body="";
    CATS.forEach(function(c){
      chips+='<li><a class="chip" href="#c-'+c.id+'" data-id="'+c.id+'">'+u.cats[c.id]+'</a></li>';
      var items=c.items.map(function(it){
        var parts=it.t[lang].split("|");
        var ds=parts[1]?'<span class="ds">'+parts[1]+'</span>':"";
        return '<li class="item'+(it.sauce?' sauce':'')+'"><p class="txt"><span class="nm">'+parts[0]+'</span>'+ds+'</p><span class="lead-dots" aria-hidden="true"></span><span class="price" dir="ltr">'+it.p+' €</span></li>';
      }).join("");
      body+='<section class="cat" id="c-'+c.id+'" aria-labelledby="h-'+c.id+'"><h2 class="cat-title" id="h-'+c.id+'"><span>'+u.cats[c.id]+'</span></h2>'+(c.note?'<p class="cat-note">'+u.note+'</p>':'')+'<ul class="items">'+items+'</ul></section>';
    });
    $("cats").innerHTML=chips;
    $("menu").innerHTML=body;
    observe();
  }

  /* Fait défiler UNIQUEMENT la barre de catégories horizontalement pour centrer
     l'onglet actif, sans jamais toucher au défilement vertical de la page
     (c'est ce qui provoquait les sauts/saccades pendant le scroll). */
  function centerChip(chip){
    var nav=chip.closest("ul");
    if(!nav) return;
    var target=chip.offsetLeft-(nav.clientWidth-chip.offsetWidth)/2;
    var max=nav.scrollWidth-nav.clientWidth;
    target=Math.max(0,Math.min(target,max));
    nav.scrollTo({left:target,behavior:"smooth"});
  }

  function observe(){
    if(spy) spy.disconnect();
    if(!("IntersectionObserver" in window)) return;
    spy=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var id=en.target.id.replace("c-","");
        document.querySelectorAll(".chip").forEach(function(ch){
          var on=ch.getAttribute("data-id")===id;
          ch.classList.toggle("on",on);
          if(on) ch.setAttribute("aria-current","true"); else ch.removeAttribute("aria-current");
          if(on) centerChip(ch);
        });
      });
    },{rootMargin:"-30% 0px -60% 0px"});
    document.querySelectorAll(".cat").forEach(function(s){spy.observe(s);});
  }
  var tick=false;
  window.addEventListener("scroll",function(){
    if(tick) return; tick=true;
    requestAnimationFrame(function(){
      tick=false;
      var first=document.querySelector(".cat");
      if(first && first.getBoundingClientRect().top>window.innerHeight*0.7){
        document.querySelectorAll(".chip.on").forEach(function(c){c.classList.remove("on");c.removeAttribute("aria-current");});
      }
    });
  },{passive:true});

  function setLang(l,persist){
    if(SUP.indexOf(l)<0) l="fr";
    lang=l;
    root.setAttribute("lang",l);
    root.setAttribute("dir",l==="ar"?"rtl":"ltr");
    var u=UI[l];
    $("title").textContent=u.title; $("lead").textContent=u.lead; $("book").textContent=u.book;
    $("back").textContent=u.back; $("prices").textContent=u.prices;
    $("langBtn").setAttribute("aria-label",u.lang); $("pills").setAttribute("aria-label",u.lang);
    $("theme").setAttribute("aria-label",u.theme);
    $("langCode").textContent=l.toUpperCase();
    document.title=u.title+" · Pirouss";
    document.querySelectorAll("[data-lang]").forEach(function(b){
      var on=b.getAttribute("data-lang")===l;
      if(b.classList.contains("pill")) b.setAttribute("aria-pressed",on);
      else b.setAttribute("aria-checked",on);
    });
    if(persist){try{localStorage.setItem("lang",l);}catch(e){}}
    render();
  }

  function initial(){
    var q=new URLSearchParams(location.search).get("lang");
    if(SUP.indexOf(q)>-1) return q;
    try{var s=localStorage.getItem("lang"); if(SUP.indexOf(s)>-1) return s;}catch(e){}
    var n=(navigator.language||"fr").slice(0,2).toLowerCase();
    return SUP.indexOf(n)>-1?n:"fr";
  }

  /* ---------- Menu de langue ---------- */
  var btn=$("langBtn"), menu=$("langMenu");
  function toggle(open){menu.hidden=!open;btn.setAttribute("aria-expanded",open);}
  btn.addEventListener("click",function(e){e.stopPropagation();toggle(menu.hidden);});
  document.addEventListener("click",function(e){if(!menu.hidden&&!menu.contains(e.target))toggle(false);});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!menu.hidden){toggle(false);btn.focus();}});
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"),true);toggle(false);});
  });

  /* ---------- Thème ---------- */
  try{var saved=localStorage.getItem("theme"); if(saved) root.setAttribute("data-theme",saved);}catch(e){}
  $("theme").addEventListener("click",function(){
    var dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next=dark?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next);}catch(e){}
  });

  setLang(initial(),false);
})();
